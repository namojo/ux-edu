<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="아날로그 UX 작업물이 터미널을 거쳐 구조화된 산출물로 변환되는 일러스트">
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.14 0 0 0 0 0.16 0 0 0 0.04 0"/><feComposite operator="over" in2="SourceGraphic"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#22242A" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="#FBFAF6"/>
  <g stroke="#EDEAE0" stroke-width="1.5"><path d="M0 250H1600M0 500H1600M0 750H1600"/><path d="M400 0V1000M800 0V1000M1200 0V1000"/></g>

  <!-- 왼쪽: 아날로그 혼돈 -->
  <g filter="url(#soft)">
    <rect x="90" y="180" width="170" height="170" rx="8" fill="#FFE455" transform="rotate(-7 175 265)"/>
    <rect x="240" y="120" width="150" height="150" rx="8" fill="#FFB4A2" transform="rotate(5 315 195)"/>
    <rect x="150" y="380" width="150" height="150" rx="8" fill="#A8D8FF" transform="rotate(-4 225 455)"/>
    <rect x="300" y="320" width="140" height="140" rx="8" fill="#FFE455" transform="rotate(9 370 390)"/>
    <rect x="80" y="580" width="300" height="210" rx="12" fill="#FFFFFF" stroke="#E4E1D5" stroke-width="3" transform="rotate(-2 230 685)"/>
    <rect x="330" y="560" width="260" height="180" rx="12" fill="#FFFFFF" stroke="#E4E1D5" stroke-width="3" transform="rotate(3 460 650)"/>
  </g>
  <!-- 와이어프레임 낙서 -->
  <g stroke="#2D3142" stroke-width="6" stroke-linecap="round" opacity="0.75">
    <path d="M120 640h180M120 680h120M120 720h150" transform="rotate(-2 230 685)"/>
    <path d="M360 600h160M360 640h100" transform="rotate(3 460 650)"/>
  </g>
  <g stroke="#F0803C" stroke-width="10" stroke-linecap="round" opacity="0.85">
    <path d="M118 678h128" transform="rotate(-2 230 685)"/>
  </g>
  <!-- 포스트잇 낙서 선 -->
  <g stroke="#22242A" stroke-width="5" stroke-linecap="round" opacity="0.5">
    <path d="M120 230h100M120 260h70" transform="rotate(-7 175 265)"/>
    <path d="M265 165h95M265 195h60" transform="rotate(5 315 195)"/>
    <path d="M180 430h90M180 460h60" transform="rotate(-4 225 455)"/>
  </g>
  <!-- 커피 자국 -->
  <circle cx="520" cy="850" r="46" fill="none" stroke="#D9CDB8" stroke-width="10" opacity="0.8"/>

  <!-- 흐름선: 혼돈 → 터미널 -->
  <g fill="none" stroke-linecap="round" stroke-width="14">
    <path d="M470 300 C 590 260, 620 380, 700 400" stroke="#FFE455"/>
    <path d="M480 470 C 580 460, 610 440, 695 445" stroke="#FFB4A2"/>
    <path d="M540 640 C 620 600, 630 500, 700 490" stroke="#A8D8FF"/>
  </g>

  <!-- 중앙: 터미널 -->
  <g filter="url(#soft)">
    <rect x="690" y="320" width="420" height="330" rx="22" fill="#2D3142"/>
    <rect x="690" y="320" width="420" height="56" rx="22" fill="#262A39"/>
    <rect x="690" y="352" width="420" height="24" fill="#262A39"/>
    <rect x="718" y="340" width="16" height="16" rx="4" fill="#FFE455"/>
    <rect x="746" y="340" width="16" height="16" rx="4" fill="#FFB4A2"/>
    <rect x="774" y="340" width="16" height="16" rx="4" fill="#A8D8FF"/>
  </g>
  <g stroke-linecap="round">
    <path d="M730 430h24l-14 14" fill="none" stroke="#FFE455" stroke-width="8"/>
    <rect x="780" y="420" width="180" height="14" rx="7" fill="#E9E7DD" opacity="0.9"/>
    <rect x="730" y="470" width="230" height="12" rx="6" fill="#8FDCB2" opacity="0.9"/>
    <rect x="730" y="500" width="180" height="12" rx="6" fill="#8FDCB2" opacity="0.7"/>
    <rect x="730" y="530" width="210" height="12" rx="6" fill="#8FDCB2" opacity="0.5"/>
    <rect x="730" y="570" width="20" height="26" fill="#FFE455"/>
  </g>

  <!-- 오른쪽: 구조화된 산출물 -->
  <!-- 저니맵 아크 -->
  <path d="M1130 420 C 1230 260, 1420 260, 1520 400" fill="none" stroke="#FFE455" stroke-width="16" stroke-linecap="round"/>
  <g fill="#2D3142"><circle cx="1150" cy="395" r="16"/><circle cx="1325" cy="300" r="16"/><circle cx="1500" cy="380" r="16"/></g>
  <g fill="#FFB4A2"><circle cx="1325" cy="300" r="8"/></g>

  <!-- 페르소나 카드 -->
  <g filter="url(#soft)">
    <rect x="1160" y="450" width="240" height="300" rx="16" fill="#FFFFFF" stroke="#E4E1D5" stroke-width="3"/>
    <circle cx="1225" cy="520" r="38" fill="#A8D8FF"/>
    <circle cx="1225" cy="508" r="14" fill="#2D3142"/>
    <path d="M1200 538 a25 16 0 0 1 50 0" fill="#2D3142"/>
    <rect x="1285" y="495" width="90" height="14" rx="7" fill="#2D3142"/>
    <rect x="1285" y="522" width="70" height="10" rx="5" fill="#C9C5B6"/>
    <rect x="1185" y="590" width="190" height="12" rx="6" fill="#FFB4A2"/>
    <rect x="1185" y="620" width="150" height="12" rx="6" fill="#FFE455"/>
    <rect x="1185" y="650" width="170" height="12" rx="6" fill="#A8D8FF"/>
    <rect x="1185" y="695" width="120" height="12" rx="6" fill="#E4E1D5"/>
  </g>

  <!-- 프로토타입 화면들 -->
  <g filter="url(#soft)">
    <rect x="1430" y="480" width="130" height="200" rx="14" fill="#FFFFFF" stroke="#E4E1D5" stroke-width="3"/>
    <rect x="1445" y="500" width="100" height="50" rx="8" fill="#FFE455"/>
    <rect x="1445" y="565" width="100" height="12" rx="6" fill="#E4E1D5"/>
    <rect x="1445" y="590" width="70" height="12" rx="6" fill="#E4E1D5"/>
    <rect x="1445" y="630" width="100" height="30" rx="15" fill="#2D3142"/>
    <rect x="1450" y="720" width="110" height="160" rx="14" fill="#FFFFFF" stroke="#E4E1D5" stroke-width="3" transform="rotate(6 1505 800)"/>
  </g>
  <path d="M1400 560 h30 M1400 600 h30" stroke="#2D3142" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- 터미널 → 산출물 흐름 -->
  <g fill="none" stroke-linecap="round" stroke-width="12" stroke-dasharray="1 22">
    <path d="M1110 420 C 1140 400, 1150 390, 1170 380" stroke="#2D3142"/>
    <path d="M1110 520 C 1130 520, 1140 530, 1160 540" stroke="#2D3142"/>
    <path d="M1110 600 C 1200 700, 1300 760, 1430 760" stroke="#2D3142"/>
  </g>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.5" fill="none"/>
</svg>
