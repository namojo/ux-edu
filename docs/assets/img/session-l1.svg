  <path d="M628 372 l-16 4 10 14" fill="none" stroke="#2D3142" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M942 552 l16 4 -10 14" fill="none" stroke="#2D3142" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 바닥 그림자 -->
