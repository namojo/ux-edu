<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="사람과 터미널이 마주 앉아 문서를 주고받는 첫 만남 일러스트">
  <defs>
    <filter id="soft1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#22242A" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="#FBFAF6"/>
  <circle cx="1380" cy="150" r="60" fill="#FFE455" opacity="0.6"/>
  <rect x="120" y="120" width="90" height="90" rx="8" fill="#A8D8FF" transform="rotate(-8 165 165)" opacity="0.8"/>

  <!-- 테이블 -->
  <rect x="330" y="640" width="940" height="34" rx="17" fill="#2D3142"/>
  <rect x="420" y="674" width="26" height="220" fill="#2D3142"/>
  <rect x="1150" y="674" width="26" height="220" fill="#2D3142"/>

  <!-- 사람 (왼쪽) -->
