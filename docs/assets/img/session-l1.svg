  <g filter="url(#soft1)">
    <rect x="950" y="300" width="360" height="300" rx="24" fill="#2D3142"/>
    <rect x="950" y="300" width="360" height="54" rx="24" fill="#262A39"/>
    <rect x="950" y="330" width="360" height="24" fill="#262A39"/>
    <rect x="976" y="318" width="15" height="15" rx="4" fill="#FFE455"/>
    <rect x="1002" y="318" width="15" height="15" rx="4" fill="#FFB4A2"/>
    <rect x="1028" y="318" width="15" height="15" rx="4" fill="#A8D8FF"/>
    <rect x="1030" y="600" width="30" height="46" fill="#2D3142"/>
    <rect x="1180" y="600" width="30" height="46" fill="#2D3142"/>
  </g>
  <!-- 터미널 표정 -->
  <circle cx="1080" cy="430" r="12" fill="#8FDCB2"/>
  <circle cx="1190" cy="430" r="12" fill="#8FDCB2"/>
  <path d="M1080 490 q50 34 100 0" fill="none" stroke="#8FDCB2" stroke-width="9" stroke-linecap="round"/>
  <rect x="1240" y="540" width="22" height="30" fill="#FFE455"/>

  <!-- 주고받는 문서 → 차트 변환 -->
  <g filter="url(#soft1)">
    <rect x="640" y="430" width="120" height="150" rx="10" fill="#FFFFFF" stroke="#E4E1D5" stroke-width="3" transform="rotate(-8 700 505)"/>
    <g transform="rotate(-8 700 505)" stroke="#22242A" stroke-width="6" stroke-linecap="round" opacity="0.6">
