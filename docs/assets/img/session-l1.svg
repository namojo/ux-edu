    <circle cx="520" cy="360" r="64" fill="#FFB4A2"/>
    <path d="M456 360 a64 64 0 0 1 128 0 v-30 a64 40 0 0 0 -128 0 z" fill="#22242A"/>
    <circle cx="500" cy="368" r="7" fill="#22242A"/>
