  <g filter="url(#soft1)">
    <rect x="800" y="380" width="140" height="130" rx="10" fill="#FFFFFF" stroke="#E4E1D5" stroke-width="3" transform="rotate(6 870 445)"/>
    <g transform="rotate(6 870 445)">
