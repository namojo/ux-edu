<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="수많은 피드백 카드가 터미널을 거쳐 정돈된 인사이트 계단으로 변환되는 일러스트">
  <defs>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#22242A" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="#FBFAF6"/>

  <!-- 쏟아지는 피드백 카드 폭포 -->
  <g>
    <g fill="#FFE455"><rect x="120" y="90" width="64" height="48" rx="6" transform="rotate(-12 152 114)"/><rect x="230" y="60" width="58" height="44" rx="6" transform="rotate(8 259 82)"/><rect x="180" y="180" width="60" height="46" rx="6" transform="rotate(20 210 203)"/><rect x="330" y="140" width="56" height="42" rx="6" transform="rotate(-15 358 161)"/><rect x="90" y="290" width="58" height="44" rx="6" transform="rotate(6 119 312)"/><rect x="290 " y="260" width="62" height="46" rx="6" transform="rotate(-6 321 283)"/></g>
    <g fill="#FFB4A2"><rect x="200" y="110" width="56" height="44" rx="6" transform="rotate(14 228 132)"/><rect x="110" y="200" width="60" height="44" rx="6" transform="rotate(-9 140 222)"/><rect x="350" y="220" width="56" height="42" rx="6" transform="rotate(10 378 241)"/><rect x="240" y="330" width="60" height="44" rx="6" transform="rotate(-18 270 352)"/><rect x="380" y="70" width="52" height="40" rx="6" transform="rotate(4 406 90)"/></g>
    <g fill="#A8D8FF"><rect x="300" y="180" width="56" height="42" rx="6" transform="rotate(-4 328 201)"/><rect x="150" y="350" width="58" height="44" rx="6" transform="rotate(12 179 372)"/><rect x="360" y="300" width="54" height="42" rx="6" transform="rotate(-10 387 321)"/><rect x="90" y="140" width="52" height="40" rx="6" transform="rotate(18 116 160)"/><rect x="260" y="220" width="50" height="38" rx="6" transform="rotate(-22 285 239)"/></g>
  </g>
  <!-- 수렴 흐름 -->
  <g fill="none" stroke-linecap="round" stroke-width="12" opacity="0.9">
    <path d="M180 400 C 300 520, 420 560, 560 580" stroke="#FFE455"/>
    <path d="M300 380 C 400 480, 480 540, 570 555" stroke="#FFB4A2"/>
    <path d="M400 340 C 480 430, 520 500, 585 530" stroke="#A8D8FF"/>
  </g>

  <!-- 중앙 터미널 -->
  <g filter="url(#soft2)">
    <rect x="560" y="470" width="340" height="270" rx="22" fill="#2D3142"/>
    <rect x="560" y="470" width="340" height="52" rx="22" fill="#262A39"/>
    <rect x="560" y="498" width="340" height="24" fill="#262A39"/>
    <rect x="586" y="487" width="15" height="15" rx="4" fill="#FFE455"/>
    <rect x="612" y="487" width="15" height="15" rx="4" fill="#FFB4A2"/>
    <rect x="638" y="487" width="15" height="15" rx="4" fill="#A8D8FF"/>
  </g>
  <g>
    <path d="M596 560h22l-13 13" fill="none" stroke="#FFE455" stroke-width="7" stroke-linecap="round"/>
    <rect x="640" y="552" width="140" height="12" rx="6" fill="#E9E7DD" opacity="0.9"/>
    <rect x="596" y="595" width="180" height="11" rx="5" fill="#8FDCB2" opacity="0.9"/>
    <rect x="596" y="622" width="140" height="11" rx="5" fill="#8FDCB2" opacity="0.7"/>
    <rect x="596" y="649" width="160" height="11" rx="5" fill="#8FDCB2" opacity="0.5"/>
    <rect x="596" y="685" width="18" height="24" fill="#FFE455"/>
  </g>

  <!-- 상승 계단: 인사이트 카드 -->
  <g filter="url(#soft2)">
    <rect x="960" y="620" width="200" height="150" rx="14" fill="#FFFFFF" stroke="#E4E1D5" stroke-width="3"/>
    <rect x="1140" y="460" width="200" height="150" rx="14" fill="#FFFFFF" stroke="#E4E1D5" stroke-width="3"/>
    <rect x="1320" y="300" width="200" height="150" rx="14" fill="#FFFFFF" stroke="#E4E1D5" stroke-width="3"/>
  </g>
  <!-- 카드1: 주제 분류 막대 -->
  <g><rect x="985" y="655" width="110" height="16" rx="8" fill="#FFB4A2"/><rect x="985" y="685" width="80" height="16" rx="8" fill="#FFE455"/><rect x="985" y="715" width="130" height="16" rx="8" fill="#A8D8FF"/></g>
  <!-- 카드2: 페르소나 -->
  <g><circle cx="1195" cy="510" r="26" fill="#A8D8FF"/><circle cx="1195" cy="502" r="10" fill="#2D3142"/><path d="M1178 522 a17 11 0 0 1 34 0" fill="#2D3142"/><rect x="1235" y="495" width="80" height="11" rx="5" fill="#2D3142"/><rect x="1235" y="516" width="60" height="9" rx="4" fill="#C9C5B6"/><rect x="1165" y="560" width="150" height="10" rx="5" fill="#FFE455"/><rect x="1165" y="580" width="110" height="10" rx="5" fill="#FFB4A2"/></g>
  <!-- 카드3: 상승 차트 -->
  <g><path d="M1350 420 L1400 390 L1445 400 L1495 340" fill="none" stroke="#F0803C" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1495" cy="340" r="10" fill="#2D3142"/><path d="M1350 430 h150" stroke="#E4E1D5" stroke-width="4"/></g>

  <!-- 터미널 → 계단 흐름 -->
  <g fill="none" stroke="#2D3142" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 20">
    <path d="M900 600 C 930 610, 940 630, 960 660"/>
    <path d="M900 540 C 1000 520, 1060 520, 1140 520"/>
    <path d="M900 500 C 1080 420, 1200 380, 1320 370"/>
  </g>

  <!-- 계단 오르는 사람 -->
  <g transform="translate(1245 372)">
    <circle cx="0" cy="0" r="22" fill="#FFB4A2"/>
    <path d="M-22 0 a22 22 0 0 1 44 0 v-10 a22 14 0 0 0 -44 0 z" fill="#22242A"/>
    <path d="M0 22 q-24 10 -20 66 h40 q4 -56 -20 -66" fill="#F0803C"/>
    <path d="M-14 40 l-22 26 M14 40 l24 20" stroke="#F0803C" stroke-width="14" stroke-linecap="round"/>
  </g>
  <ellipse cx="800" cy="930" rx="480" ry="24" fill="#22242A" opacity="0.07"/>
</svg>
